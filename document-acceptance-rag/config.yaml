db:
  path: "data/cases.db"

poller:
  interval_seconds: 45

ollama:
  base_url: "http://localhost:11434"
  model: "qwen3:8b"
  timeout_seconds: 300

embeddings:
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"

chroma:
  persist_directory: "chroma_db"
  collection_prefix: "historical_cases"

novelty:
  k_neighbours: 5
  # Percentile of the historical self-distance distribution used as flag threshold.
  # Lower = more sensitive (more flags). Start at 95, tune after first pilot run.
  threshold_percentile: 95

adjudication:
  # Master switch. When false, novel cases always go to a human (legacy behaviour).
  enabled: true
  rubric_path: "rubric.yaml"
  # Confidence gates for auto-deciding a novel case (0..1).
  # Below both gates the case is escalated to a human.
  auto_accept_confidence: 0.85
  auto_reject_confidence: 0.85

hardening:
  # After this many consistent, high-confidence judgments for the same pattern
  # signature, the pattern is promoted to a deterministic learned rule.
  promote_after: 3

rules:
  # How old a registration_date can be (years) before triggering EXPIRED_REGISTRATION.
  max_registration_age_years: 10
