[theme]
# Emerald green + white brand theme.
primaryColor = "#059669"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ecfdf5"
textColor = "#0f291f"
font = "sans-serif"
baseRadius = "0.6rem"
borderColor = "#d1fae5"
showWidgetBorder = true

[theme.sidebar]
# Solid emerald sidebar with white text.
backgroundColor = "#065f46"
secondaryBackgroundColor = "#047857"
textColor = "#ecfdf5"
primaryColor = "#6ee7b7"
borderColor = "#047857"

[server]
runOnSave = true
