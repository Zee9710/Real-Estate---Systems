[theme]
# Professional theme with an indigo/teal accent on a soft off-white canvas.
primaryColor = "#4f46e5"
backgroundColor = "#fbfcfe"
secondaryBackgroundColor = "#eef2f9"
textColor = "#1e293b"
font = "sans-serif"
baseRadius = "0.6rem"
borderColor = "#e2e8f0"
showWidgetBorder = true

[theme.sidebar]
# Deep indigo gradient-friendly base for contrast against the light canvas.
backgroundColor = "#1e1b4b"
secondaryBackgroundColor = "#312e81"
textColor = "#e0e7ff"
primaryColor = "#818cf8"
borderColor = "#312e81"

[server]
runOnSave = true
