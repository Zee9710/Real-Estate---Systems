[theme]
# Professional light corporate theme (deep navy on white)
primaryColor = "#1e3a8a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#1f2937"
font = "sans-serif"
baseRadius = "0.4rem"
borderColor = "#e2e8f0"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#cbd5e1"
primaryColor = "#60a5fa"
borderColor = "#1e293b"

[server]
runOnSave = true
